name: Deploy Staging

on:
  workflow_dispatch:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Kubernetes (Staging)
        run: |
          kubectl config use-context staging
          helm upgrade --install escort-crm infra/helm/escort-crm/ \
            -f infra/helm/escort-crm/values-staging.yaml \
            --namespace escort-crm-staging \
            --create-namespace

      - name: Health check
        run: |
          sleep 60
          curl -sf https://staging.api.escort-crm.com/health || exit 1

      - name: Run smoke tests
        run: |
          pip install robotframework robotframework-requests
          robot --include smoke tests/e2e/suites/
