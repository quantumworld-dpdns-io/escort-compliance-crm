name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  go-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, auth, companion, booking, compliance, screening, credentials, quantum]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: Build ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: |
          go mod download
          go build -v ./...
      
      - name: Test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: go test -v ./...

  node-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [payments, messaging, realtime]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: npm ci
      
      - name: Build ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: npm run build
      
      - name: Test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: npm test

  python-services:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install ML service
        working-directory: services/ml
        run: |
          pip install -e ".[dev]"
      
      - name: Test ML service
        working-directory: services/ml
        run: pytest -v

  rust-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [crypto, data]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: cargo build --release
      
      - name: Test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: cargo test

  julia-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [QuantumOpt.jl, QuantumML.jl]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      
      - name: Test ${{ matrix.service }}
        working-directory: services/quantum/${{ matrix.service }}
        run: julia --project -e 'using Pkg; Pkg.test()'

  frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install frontend
        working-directory: frontend/web
        run: npm ci
      
      - name: Build frontend
        working-directory: frontend/web
        run: npm run build
      
      - name: Test frontend
        working-directory: frontend/web
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    needs: [go-services, node-services, python-services, rust-services, frontend]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build all Docker images
        run: |
          for service in gateway auth companion booking compliance screening credentials payments messaging realtime ml quantum crypto data; do
            echo "Building $service..."
            docker build -t escort-crm-$service:latest -f services/$service/Dockerfile .
          done
