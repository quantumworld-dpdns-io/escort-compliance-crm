[package]
name = "escort-crm-crypto"
version = "0.1.0"
edition = "2021"
description = "PQC crypto service for escort-compliance-crm"

[lib]
name = "escort_crm_crypto"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "crypto-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
ring = "0.17"
aes-gcm = "0.10"
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
liboqs = "0.12"

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "pqc_benchmark"
harness = false
