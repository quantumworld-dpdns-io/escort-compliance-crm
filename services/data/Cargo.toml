[package]
name = "escort-crm-data"
version = "0.1.0"
edition = "2021"
description = "Data lakehouse service for escort-compliance-crm"

[lib]
name = "escort_crm_data"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "data-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
datafusion = "35"
arrow = "50"
parquet = "50"
object_store = { version = "0.9", features = ["aws", "gcp", "azure"] }
datafusion-common = "35"
datafusion-expr = "35"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
