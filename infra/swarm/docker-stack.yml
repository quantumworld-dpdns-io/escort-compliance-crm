version: '3.8'

services:
  gateway:
    image: escort-crm/gateway:latest
    ports:
      - "8080:8080"
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  auth:
    image: escort-crm/auth:latest
    deploy:
      replicas: 2

  quantum:
    image: escort-crm/quantum:latest
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.quantum == true

  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      placement:
        constraints:
          - node.labels.database == true

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    deploy:
      placement:
        constraints:
          - node.role == manager

volumes:
  postgres-data:
  redis-data:
