apiVersion: v1
kind: ServiceAccount
metadata:
  name: escort-service-account
  namespace: escort-crm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: escort-role
  namespace: escort-crm
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: escort-role-binding
  namespace: escort-crm
subjects:
- kind: ServiceAccount
  name: escort-service-account
  namespace: escort-crm
roleRef:
  kind: Role
  name: escort-role
  apiGroup: rbac.authorization.k8s.io
