apiVersion: v1
kind: Service
metadata:
  name: {{ include "escort-crm.fullname" . }}-data
  labels:
    {{- include "escort-crm.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8092
      targetPort: data
      protocol: TCP
      name: http
  selector:
    {{- include "escort-crm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "escort-crm.fullname" . }}-data
  labels:
    {{- include "escort-crm.labels" . | nindent 4 }}
    app.kubernetes.io/component: data
spec:
  replicas: {{ .Values.data.replicaCount }}
  selector:
    matchLabels:
      {{- include "escort-crm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: data
  template:
    metadata:
      labels:
        {{- include "escort-crm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: data
    spec:
      containers:
        - name: data
          image: "{{ .Values.data.image.repository }}:{{ .Values.data.image.tag }}"
          imagePullPolicy: {{ .Values.data.image.pullPolicy }}
          ports:
            - name: data
              containerPort: 8092
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: data
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: data
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.data.resources | nindent 12 }}
