apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-data
  labels:
    app: data
spec:
  replicas: {{ .Values.replicaCount.data | default 1 }}
  selector:
    matchLabels:
      app: data
  template:
    metadata:
      labels:
        app: data
    spec:
      containers:
      - name: data
        image: "{{ .Values.image.repository }}/data:{{ .Values.image.tag }}"
        ports:
        - containerPort: 8092
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
