apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-realtime
  labels:
    app: realtime
spec:
  replicas: {{ .Values.replicaCount.realtime | default 1 }}
  selector:
    matchLabels:
      app: realtime
  template:
    metadata:
      labels:
        app: realtime
    spec:
      containers:
      - name: realtime
        image: "{{ .Values.image.repository }}/realtime:{{ .Values.image.tag }}"
        ports:
        - containerPort: 8089
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
