apiVersion: v1
kind: Service
metadata:
  name: {{ include "escort-crm.fullname" . }}-payments
  labels:
    {{- include "escort-crm.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8087
      targetPort: payments
      protocol: TCP
      name: http
  selector:
    {{- include "escort-crm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: payments
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "escort-crm.fullname" . }}-payments
  labels:
    {{- include "escort-crm.labels" . | nindent 4 }}
    app.kubernetes.io/component: payments
spec:
  replicas: {{ .Values.payments.replicaCount }}
  selector:
    matchLabels:
      {{- include "escort-crm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: payments
  template:
    metadata:
      labels:
        {{- include "escort-crm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: payments
    spec:
      containers:
        - name: payments
          image: "{{ .Values.payments.image.repository }}:{{ .Values.payments.image.tag }}"
          imagePullPolicy: {{ .Values.payments.image.pullPolicy }}
          ports:
            - name: payments
              containerPort: 8087
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: payments
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: payments
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "escort-crm.fullname" . }}-secrets
                  key: database-url
          resources:
            {{- toYaml .Values.payments.resources | nindent 12 }}
