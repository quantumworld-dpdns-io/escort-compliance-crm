apiVersion: v1
kind: Service
metadata:
  name: {{ include "escort-crm.fullname" . }}-gateway
  labels:
    {{- include "escort-crm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: gateway
      protocol: TCP
      name: http
  selector:
    {{- include "escort-crm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "escort-crm.fullname" . }}-gateway
  labels:
    {{- include "escort-crm.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "escort-crm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "escort-crm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: gateway
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: gateway
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: gateway
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "escort-crm.fullname" . }}-secrets
                  key: jwt-secret
            - name: AUTH_SERVICE_URL
              value: "http://{{ include "escort-crm.fullname" . }}-auth:8081"
            - name: COMPANION_SERVICE_URL
              value: "http://{{ include "escort-crm.fullname" . }}-companion:8082"
            - name: BOOKING_SERVICE_URL
              value: "http://{{ include "escort-crm.fullname" . }}-booking:8083"
            - name: COMPLIANCE_SERVICE_URL
              value: "http://{{ include "escort-crm.fullname" . }}-compliance:8084"
            - name: SCREENING_SERVICE_URL
              value: "http://{{ include "escort-crm.fullname" . }}-screening:8085"
            - name: CREDENTIALS_SERVICE_URL
              value: "http://{{ include "escort-crm.fullname" . }}-credentials:8086"
            - name: PAYMENTS_SERVICE_URL
              value: "http://{{ include "escort-crm.fullname" . }}-payments:8087"
            - name: MESSAGING_SERVICE_URL
              value: "http://{{ include "escort-crm.fullname" . }}-messaging:8088"
            - name: REALTIME_SERVICE_URL
              value: "http://{{ include "escort-crm.fullname" . }}-realtime:8089"
            - name: ML_SERVICE_URL
              value: "http://{{ include "escort-crm.fullname" . }}-ml:8090"
            - name: QUANTUM_SERVICE_URL
              value: "http://{{ include "escort-crm.fullname" . }}-quantum:8091"
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
