apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-booking
  labels:
    app: booking
spec:
  replicas: {{ .Values.replicaCount.booking | default 1 }}
  selector:
    matchLabels:
      app: booking
  template:
    metadata:
      labels:
        app: booking
    spec:
      containers:
      - name: booking
        image: "{{ .Values.image.repository }}/booking:{{ .Values.image.tag }}"
        ports:
        - containerPort: 8083
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
