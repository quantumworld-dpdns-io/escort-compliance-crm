apiVersion: v1
kind: Service
metadata:
  name: {{ include "escort-crm.fullname" . }}-compliance
  labels:
    {{- include "escort-crm.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8084
      targetPort: compliance
      protocol: TCP
      name: http
  selector:
    {{- include "escort-crm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: compliance
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "escort-crm.fullname" . }}-compliance
  labels:
    {{- include "escort-crm.labels" . | nindent 4 }}
    app.kubernetes.io/component: compliance
spec:
  replicas: {{ .Values.compliance.replicaCount }}
  selector:
    matchLabels:
      {{- include "escort-crm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: compliance
  template:
    metadata:
      labels:
        {{- include "escort-crm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: compliance
    spec:
      containers:
        - name: compliance
          image: "{{ .Values.compliance.image.repository }}:{{ .Values.compliance.image.tag }}"
          imagePullPolicy: {{ .Values.compliance.image.pullPolicy }}
          ports:
            - name: compliance
              containerPort: 8084
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: compliance
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: compliance
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "escort-crm.fullname" . }}-secrets
                  key: database-url
          resources:
            {{- toYaml .Values.compliance.resources | nindent 12 }}
