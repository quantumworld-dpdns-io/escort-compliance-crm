apiVersion: v1
kind: Service
metadata:
  name: {{ include "escort-crm.fullname" . }}-messaging
  labels:
    {{- include "escort-crm.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8088
      targetPort: messaging
      protocol: TCP
      name: http
  selector:
    {{- include "escort-crm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: messaging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "escort-crm.fullname" . }}-messaging
  labels:
    {{- include "escort-crm.labels" . | nindent 4 }}
    app.kubernetes.io/component: messaging
spec:
  replicas: {{ .Values.messaging.replicaCount }}
  selector:
    matchLabels:
      {{- include "escort-crm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: messaging
  template:
    metadata:
      labels:
        {{- include "escort-crm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: messaging
    spec:
      containers:
        - name: messaging
          image: "{{ .Values.messaging.image.repository }}:{{ .Values.messaging.image.tag }}"
          imagePullPolicy: {{ .Values.messaging.image.pullPolicy }}
          ports:
            - name: messaging
              containerPort: 8088
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: messaging
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: messaging
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "escort-crm.fullname" . }}-secrets
                  key: database-url
          resources:
            {{- toYaml .Values.messaging.resources | nindent 12 }}
