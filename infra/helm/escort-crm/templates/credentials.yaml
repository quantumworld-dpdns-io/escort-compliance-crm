apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-credentials
  labels:
    app: credentials
spec:
  replicas: {{ .Values.replicaCount.credentials | default 1 }}
  selector:
    matchLabels:
      app: credentials
  template:
    metadata:
      labels:
        app: credentials
    spec:
      containers:
      - name: credentials
        image: "{{ .Values.image.repository }}/credentials:{{ .Values.image.tag }}"
        ports:
        - containerPort: 8086
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
