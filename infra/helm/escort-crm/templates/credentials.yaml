apiVersion: v1
kind: Service
metadata:
  name: {{ include "escort-crm.fullname" . }}-credentials
  labels:
    {{- include "escort-crm.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8086
      targetPort: credentials
      protocol: TCP
      name: http
  selector:
    {{- include "escort-crm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "escort-crm.fullname" . }}-credentials
  labels:
    {{- include "escort-crm.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
spec:
  replicas: {{ .Values.credentials.replicaCount }}
  selector:
    matchLabels:
      {{- include "escort-crm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: credentials
  template:
    metadata:
      labels:
        {{- include "escort-crm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: credentials
    spec:
      containers:
        - name: credentials
          image: "{{ .Values.credentials.image.repository }}:{{ .Values.credentials.image.tag }}"
          imagePullPolicy: {{ .Values.credentials.image.pullPolicy }}
          ports:
            - name: credentials
              containerPort: 8086
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: credentials
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: credentials
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "escort-crm.fullname" . }}-secrets
                  key: database-url
          resources:
            {{- toYaml .Values.credentials.resources | nindent 12 }}
