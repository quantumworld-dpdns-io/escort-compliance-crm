apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ml
  labels:
    app: ml
spec:
  replicas: {{ .Values.replicaCount.ml | default 1 }}
  selector:
    matchLabels:
      app: ml
  template:
    metadata:
      labels:
        app: ml
    spec:
      containers:
      - name: ml
        image: "{{ .Values.image.repository }}/ml:{{ .Values.image.tag }}"
        ports:
        - containerPort: 8091
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
