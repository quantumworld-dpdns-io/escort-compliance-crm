apiVersion: v1
kind: Service
metadata:
  name: {{ include "escort-crm.fullname" . }}-ml
  labels:
    {{- include "escort-crm.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8090
      targetPort: ml
      protocol: TCP
      name: http
  selector:
    {{- include "escort-crm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "escort-crm.fullname" . }}-ml
  labels:
    {{- include "escort-crm.labels" . | nindent 4 }}
    app.kubernetes.io/component: ml
spec:
  replicas: {{ .Values.ml.replicaCount }}
  selector:
    matchLabels:
      {{- include "escort-crm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ml
  template:
    metadata:
      labels:
        {{- include "escort-crm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ml
    spec:
      containers:
        - name: ml
          image: "{{ .Values.ml.image.repository }}:{{ .Values.ml.image.tag }}"
          imagePullPolicy: {{ .Values.ml.image.pullPolicy }}
          ports:
            - name: ml
              containerPort: 8090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: ml
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: ml
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ml.resources | nindent 12 }}
