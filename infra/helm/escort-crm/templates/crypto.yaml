apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-crypto
  labels:
    app: crypto
spec:
  replicas: {{ .Values.replicaCount.crypto | default 1 }}
  selector:
    matchLabels:
      app: crypto
  template:
    metadata:
      labels:
        app: crypto
    spec:
      containers:
      - name: crypto
        image: "{{ .Values.image.repository }}/crypto:{{ .Values.image.tag }}"
        ports:
        - containerPort: 8093
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
