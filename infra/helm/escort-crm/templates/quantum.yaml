apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-quantum
  labels:
    app: quantum
spec:
  replicas: {{ .Values.replicaCount.quantum | default 1 }}
  selector:
    matchLabels:
      app: quantum
  template:
    metadata:
      labels:
        app: quantum
    spec:
      containers:
      - name: quantum
        image: "{{ .Values.image.repository }}/quantum:{{ .Values.image.tag }}"
        ports:
        - containerPort: 8090
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
