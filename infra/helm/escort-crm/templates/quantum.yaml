apiVersion: v1
kind: Service
metadata:
  name: {{ include "escort-crm.fullname" . }}-quantum
  labels:
    {{- include "escort-crm.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8091
      targetPort: quantum
      protocol: TCP
      name: http
  selector:
    {{- include "escort-crm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: quantum
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "escort-crm.fullname" . }}-quantum
  labels:
    {{- include "escort-crm.labels" . | nindent 4 }}
    app.kubernetes.io/component: quantum
spec:
  replicas: {{ .Values.quantum.replicaCount }}
  selector:
    matchLabels:
      {{- include "escort-crm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: quantum
  template:
    metadata:
      labels:
        {{- include "escort-crm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: quantum
    spec:
      containers:
        - name: quantum
          image: "{{ .Values.quantum.image.repository }}:{{ .Values.quantum.image.tag }}"
          imagePullPolicy: {{ .Values.quantum.image.pullPolicy }}
          ports:
            - name: quantum
              containerPort: 8091
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: quantum
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: quantum
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.quantum.resources | nindent 12 }}
