version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: escort_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      GIN_MODE: release
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      AUTH_SERVICE_URL: http://auth:8081
      COMPANION_SERVICE_URL: http://companion:8082
      BOOKING_SERVICE_URL: http://booking:8083
      COMPLIANCE_SERVICE_URL: http://compliance:8084
      SCREENING_SERVICE_URL: http://screening:8085
      CREDENTIALS_SERVICE_URL: http://credentials:8086
      PAYMENTS_SERVICE_URL: http://payments:8087
      MESSAGING_SERVICE_URL: http://messaging:8088
      REALTIME_SERVICE_URL: http://realtime:8089
      ML_SERVICE_URL: http://ml:8090
      QUANTUM_SERVICE_URL: http://quantum:8091
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      GIN_MODE: release
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/escort_crm?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      REDIS_URL: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  companion:
    build:
      context: .
      dockerfile: services/companion/Dockerfile
    environment:
      GIN_MODE: release
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/escort_crm?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  booking:
    build:
      context: .
      dockerfile: services/booking/Dockerfile
    environment:
      GIN_MODE: release
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/escort_crm?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  compliance:
    build:
      context: .
      dockerfile: services/compliance/Dockerfile
    environment:
      GIN_MODE: release
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/escort_crm?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  screening:
    build:
      context: .
      dockerfile: services/screening/Dockerfile
    environment:
      GIN_MODE: release
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/escort_crm?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  credentials:
    build:
      context: .
      dockerfile: services/credentials/Dockerfile
    environment:
      GIN_MODE: release
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/escort_crm?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  payments:
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    environment:
      GIN_MODE: release
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/escort_crm?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  messaging:
    build:
      context: .
      dockerfile: services/messaging/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/escort_crm?sslmode=disable
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  realtime:
    build:
      context: .
      dockerfile: services/realtime/Dockerfile
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  ml:
    build:
      context: .
      dockerfile: services/ml/Dockerfile
    ports:
      - "8090:8090"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/escort_crm?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  quantum:
    build:
      context: .
      dockerfile: services/quantum/Dockerfile
    ports:
      - "8091:8091"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/escort_crm?sslmode=disable

  crypto:
    build:
      context: .
      dockerfile: services/crypto/Dockerfile
    ports:
      - "8093:8093"

  data:
    build:
      context: .
      dockerfile: services/data/Dockerfile
    ports:
      - "8092:8092"

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  kafka_data:
