<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escort Compliance CRM</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
  <div id="app" x-data="app" x-cloak>
    <!-- Loading -->
    <template x-if="loading">
      <div class="flex items-center justify-center min-h-screen">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary-600"></div>
      </div>
    </template>

    <!-- Not Authenticated -->
    <template x-if="!loading && !$store.auth.isAuthenticated">
      <div>
        <template x-if="currentPage === 'login'">
          <div x-data="loginPage()" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-primary-50 to-quantum-50">
            <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-xl">
              <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-gray-900">Escort Compliance CRM</h1>
                <p class="text-gray-500 mt-2">Sign in to your account</p>
              </div>
              <form @submit.prevent="handleLogin" class="space-y-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                  <input x-model="email" type="email" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                    placeholder="you@example.com">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                  <input x-model="password" type="password" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                    placeholder="Enter password">
                </div>
                <div x-show="error" class="text-red-600 text-sm" x-text="error"></div>
                <button type="submit" :disabled="submitting"
                  class="w-full py-2 px-4 bg-primary-600 text-white rounded-lg hover:bg-primary-700 disabled:opacity-50 transition">
                  <span x-show="!submitting">Sign In</span>
                  <span x-show="submitting">Signing in...</span>
                </button>
              </form>
              <div class="mt-6 text-center">
                <a @click.prevent="$dispatch('navigate', 'register')" href="#" class="text-primary-600 hover:underline text-sm">
                  Create an account
                </a>
              </div>
              <div class="mt-4 border-t pt-4">
                <p class="text-xs text-gray-500 text-center mb-2">Or sign in with</p>
                <div class="flex gap-2">
                  <button class="flex-1 py-2 border rounded-lg hover:bg-gray-50 text-sm">GitHub</button>
                  <button class="flex-1 py-2 border rounded-lg hover:bg-gray-50 text-sm">Google</button>
                </div>
              </div>
            </div>
          </div>
        </template>
        <template x-if="currentPage === 'register'">
          <div x-data="registerPage()" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-primary-50 to-quantum-50">
            <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-xl">
              <h1 class="text-2xl font-bold text-center mb-6">Create Account</h1>
              <form @submit.prevent="handleRegister" class="space-y-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Display Name</label>
                  <input x-model="displayName" type="text" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary-500">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                  <input x-model="email" type="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary-500">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                  <input x-model="password" type="password" required minlength="8" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary-500">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
                  <select x-model="role" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary-500">
                    <option value="client">Client</option>
                    <option value="companion">Companion</option>
                  </select>
                </div>
                <div x-show="error" class="text-red-600 text-sm" x-text="error"></div>
                <button type="submit" :disabled="submitting"
                  class="w-full py-2 px-4 bg-primary-600 text-white rounded-lg hover:bg-primary-700 disabled:opacity-50">
                  Create Account
                </button>
              </form>
              <p class="mt-4 text-center text-sm">
                Already have an account? <a @click.prevent="$dispatch('navigate', 'login')" href="#" class="text-primary-600 hover:underline">Sign in</a>
              </p>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- Authenticated App Shell -->
    <template x-if="!loading && $store.auth.isAuthenticated">
      <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-900 text-white flex flex-col" x-show="sidebarOpen" x-transition>
          <div class="p-4 border-b border-gray-700">
            <h1 class="text-lg font-bold">Escort CRM</h1>
            <p class="text-xs text-gray-400">Compliance Platform</p>
          </div>
          <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
            <a @click.prevent="navigate('dashboard')" href="#" :class="currentPage === 'dashboard' ? 'bg-gray-700' : ''" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 text-sm">
              <span>Dashboard</span>
            </a>
            <a @click.prevent="navigate('companions')" href="#" :class="currentPage === 'companions' ? 'bg-gray-700' : ''" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 text-sm">
              <span>Companions</span>
            </a>
            <a @click.prevent="navigate('bookings')" href="#" :class="currentPage === 'bookings' ? 'bg-gray-700' : ''" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 text-sm">
              <span>Bookings</span>
            </a>
            <a @click.prevent="navigate('compliance')" href="#" :class="currentPage === 'compliance' ? 'bg-gray-700' : ''" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 text-sm">
              <span>Compliance</span>
            </a>
            <a @click.prevent="navigate('screening')" href="#" :class="currentPage === 'screening' ? 'bg-gray-700' : ''" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 text-sm">
              <span>Screening</span>
            </a>
            <a @click.prevent="navigate('credentials')" href="#" :class="currentPage === 'credentials' ? 'bg-gray-700' : ''" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 text-sm">
              <span>Credentials</span>
            </a>
            <a @click.prevent="navigate('payments')" href="#" :class="currentPage === 'payments' ? 'bg-gray-700' : ''" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 text-sm">
              <span>Payments</span>
            </a>
            <a @click.prevent="navigate('messages')" href="#" :class="currentPage === 'messages' ? 'bg-gray-700' : ''" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 text-sm">
              <span>Messages</span>
            </a>
            <a @click.prevent="navigate('quantum')" href="#" :class="currentPage === 'quantum' ? 'bg-gray-700' : ''" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 text-sm text-quantum-300">
              <span>Quantum</span>
            </a>
            <a @click.prevent="navigate('settings')" href="#" :class="currentPage === 'settings' ? 'bg-gray-700' : ''" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 text-sm">
              <span>Settings</span>
            </a>
          </nav>
          <div class="p-4 border-t border-gray-700">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 bg-primary-600 rounded-full flex items-center justify-center text-sm font-bold" x-text="$store.auth.user?.name?.charAt(0) || 'U'"></div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium truncate" x-text="$store.auth.user?.name || 'User'"></p>
                <p class="text-xs text-gray-400 truncate" x-text="$store.auth.user?.email || ''"></p>
              </div>
              <button @click="$store.auth.logout()" class="text-gray-400 hover:text-white text-sm">Logout</button>
            </div>
          </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto">
          <!-- Header -->
          <header class="bg-white border-b px-6 py-4 flex items-center justify-between sticky top-0 z-10">
            <div class="flex items-center gap-4">
              <button @click="sidebarOpen = !sidebarOpen" class="lg:hidden">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
              </button>
              <h2 class="text-lg font-semibold capitalize" x-text="currentPage"></h2>
            </div>
            <div class="flex items-center gap-4">
              <button class="relative p-2 text-gray-500 hover:text-gray-700">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                <span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-xs rounded-full flex items-center justify-center">3</span>
              </button>
              <div class="w-8 h-8 bg-primary-600 rounded-full flex items-center justify-center text-white text-sm font-bold" x-text="$store.auth.user?.name?.charAt(0) || 'U'"></div>
            </div>
          </header>

          <!-- Page Content -->
          <div class="p-6">
            <!-- Dashboard -->
            <template x-if="currentPage === 'dashboard'">
              <div x-data="dashboardPage()" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div class="bg-white rounded-xl p-6 shadow-sm border">
                    <p class="text-sm text-gray-500">Total Companions</p>
                    <p class="text-3xl font-bold mt-1" x-text="stats.companions">0</p>
                  </div>
                  <div class="bg-white rounded-xl p-6 shadow-sm border">
                    <p class="text-sm text-gray-500">Active Bookings</p>
                    <p class="text-3xl font-bold mt-1 text-green-600" x-text="stats.activeBookings">0</p>
                  </div>
                  <div class="bg-white rounded-xl p-6 shadow-sm border">
                    <p class="text-sm text-gray-500">Compliance Score</p>
                    <p class="text-3xl font-bold mt-1 text-primary-600" x-text="stats.complianceScore + '%'">0%</p>
                  </div>
                  <div class="bg-white rounded-xl p-6 shadow-sm border">
                    <p class="text-sm text-gray-500">Quantum Status</p>
                    <p class="text-3xl font-bold mt-1 text-quantum-600">Active</p>
                  </div>
                </div>
                <div class="bg-white rounded-xl p-6 shadow-sm border">
                  <h3 class="font-semibold mb-4">Recent Activity</h3>
                  <div class="space-y-3">
                    <div class="flex items-center gap-3 text-sm">
                      <span class="w-2 h-2 bg-green-500 rounded-full"></span>
                      <span class="text-gray-500">2 min ago</span>
                      <span>New booking confirmed #B-1042</span>
                    </div>
                    <div class="flex items-center gap-3 text-sm">
                      <span class="w-2 h-2 bg-blue-500 rounded-full"></span>
                      <span class="text-gray-500">15 min ago</span>
                      <span>Compliance check passed for US-CA</span>
                    </div>
                    <div class="flex items-center gap-3 text-sm">
                      <span class="w-2 h-2 bg-purple-500 rounded-full"></span>
                      <span class="text-gray-500">1 hour ago</span>
                      <span>PQC key rotation completed</span>
                    </div>
                  </div>
                </div>
              </div>
            </template>

            <!-- Companions -->
            <template x-if="currentPage === 'companions'">
              <div x-data="companionsPage()" class="space-y-4">
                <div class="flex justify-between items-center">
                  <input type="search" x-model="search" placeholder="Search companions..." class="px-4 py-2 border rounded-lg w-64 focus:ring-2 focus:ring-primary-500">
                  <button @click="showCreateModal = true" class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700">+ New Companion</button>
                </div>
                <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                  <table class="w-full">
                    <thead class="bg-gray-50">
                      <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Jurisdiction</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Rate</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y">
                      <template x-for="c in companions" :key="c.id">
                        <tr class="hover:bg-gray-50">
                          <td class="px-6 py-4">
                            <div class="flex items-center gap-3">
                              <div class="w-8 h-8 bg-primary-100 text-primary-700 rounded-full flex items-center justify-center text-sm font-bold" x-text="c.name.charAt(0)"></div>
                              <span class="font-medium" x-text="c.name"></span>
                            </div>
                          </td>
                          <td class="px-6 py-4 text-sm text-gray-600" x-text="c.jurisdiction"></td>
                          <td class="px-6 py-4 text-sm" x-text="'$' + c.rate + '/hr'"></td>
                          <td class="px-6 py-4">
                            <span class="px-2 py-1 text-xs rounded-full" :class="c.verified ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'" x-text="c.verified ? 'Verified' : 'Pending'"></span>
                          </td>
                          <td class="px-6 py-4 text-sm">
                            <button class="text-primary-600 hover:underline">View</button>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </template>

            <!-- Bookings -->
            <template x-if="currentPage === 'bookings'">
              <div x-data="bookingsPage()" class="space-y-4">
                <div class="flex justify-between items-center">
                  <h3 class="text-lg font-semibold">Bookings</h3>
                  <button class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700">+ New Booking</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <template x-for="b in bookings" :key="b.id">
                    <div class="bg-white rounded-xl p-4 shadow-sm border">
                      <div class="flex justify-between items-start">
                        <span class="font-mono text-xs text-gray-500" x-text="'#' + b.id"></span>
                        <span class="px-2 py-1 text-xs rounded-full" :class="statusClass(b.status)" x-text="b.status"></span>
                      </div>
                      <p class="mt-2 font-medium" x-text="b.companion"></p>
                      <p class="text-sm text-gray-500" x-text="b.date"></p>
                      <p class="text-sm text-gray-500" x-text="b.jurisdiction"></p>
                      <div class="mt-3 flex gap-2">
                        <button class="text-xs px-3 py-1 border rounded hover:bg-gray-50">View</button>
                        <button x-show="b.status === 'pending'" class="text-xs px-3 py-1 bg-green-500 text-white rounded hover:bg-green-600">Confirm</button>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <!-- Compliance -->
            <template x-if="currentPage === 'compliance'">
              <div x-data="compliancePage()" class="space-y-4">
                <h3 class="text-lg font-semibold">Compliance Dashboard</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div class="bg-white rounded-xl p-6 shadow-sm border">
                    <p class="text-sm text-gray-500">Overall Score</p>
                    <p class="text-4xl font-bold text-green-600 mt-1" x-text="score + '%'"></p>
                  </div>
                  <div class="bg-white rounded-xl p-6 shadow-sm border">
                    <p class="text-sm text-gray-500">Active Jurisdictions</p>
                    <p class="text-4xl font-bold mt-1" x-text="jurisdictions.length"></p>
                  </div>
                  <div class="bg-white rounded-xl p-6 shadow-sm border">
                    <p class="text-sm text-gray-500">Open Alerts</p>
                    <p class="text-4xl font-bold text-yellow-600 mt-1" x-text="alerts.length"></p>
                  </div>
                </div>
                <div class="bg-white rounded-xl p-6 shadow-sm border">
                  <h4 class="font-semibold mb-3">Jurisdictions</h4>
                  <div class="space-y-2">
                    <template x-for="j in jurisdictions" :key="j.id">
                      <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                        <div>
                          <span class="font-medium" x-text="j.name"></span>
                          <span class="text-sm text-gray-500 ml-2" x-text="j.status"></span>
                        </div>
                        <span class="text-sm font-medium" :class="j.compliant ? 'text-green-600' : 'text-red-600'" x-text="j.compliant ? 'Compliant' : 'Non-Compliant'"></span>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </template>

            <!-- Quantum Dashboard -->
            <template x-if="currentPage === 'quantum'">
              <div x-data="quantumPage()" class="space-y-4">
                <h3 class="text-lg font-semibold text-quantum-700">Quantum Computing Dashboard</h3>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                  <div class="bg-gradient-to-br from-quantum-50 to-purple-50 rounded-xl p-6 border border-quantum-200">
                    <p class="text-sm text-quantum-600">PQC Status</p>
                    <p class="text-2xl font-bold text-quantum-700 mt-1">Active</p>
                    <p class="text-xs text-quantum-500 mt-1">Kyber768 + Dilithium3</p>
                  </div>
                  <div class="bg-gradient-to-br from-quantum-50 to-purple-50 rounded-xl p-6 border border-quantum-200">
                    <p class="text-sm text-quantum-600">Optimization</p>
                    <p class="text-2xl font-bold text-quantum-700 mt-1">QAOA</p>
                    <p class="text-xs text-quantum-500 mt-1">142 optimizations run</p>
                  </div>
                  <div class="bg-gradient-to-br from-quantum-50 to-purple-50 rounded-xl p-6 border border-quantum-200">
                    <p class="text-sm text-quantum-600">QML Models</p>
                    <p class="text-2xl font-bold text-quantum-700 mt-1">3</p>
                    <p class="text-xs text-quantum-500 mt-1">Safety, Compliance, Fraud</p>
                  </div>
                  <div class="bg-gradient-to-br from-quantum-50 to-purple-50 rounded-xl p-6 border border-quantum-200">
                    <p class="text-sm text-quantum-600">QRNG</p>
                    <p class="text-2xl font-bold text-quantum-700 mt-1">Online</p>
                    <p class="text-xs text-quantum-500 mt-1">256-bit entropy pool</p>
                  </div>
                </div>
                <div class="bg-white rounded-xl p-6 shadow-sm border">
                  <h4 class="font-semibold mb-3">PQC Key Management</h4>
                  <div class="space-y-2">
                    <template x-for="k in pqcKeys" :key="k.id">
                      <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                        <div class="flex items-center gap-3">
                          <span class="w-2 h-2 bg-green-500 rounded-full"></span>
                          <span class="font-mono text-sm" x-text="k.algorithm"></span>
                          <span class="text-xs text-gray-500" x-text="'Created: ' + k.created"></span>
                        </div>
                        <button class="text-xs px-3 py-1 border rounded hover:bg-gray-50">Rotate</button>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </template>

            <!-- Screening -->
            <template x-if="currentPage === 'screening'">
              <div x-data="screeningPage()" class="space-y-4">
                <div class="flex justify-between items-center">
                  <h3 class="text-lg font-semibold">Safety Screening</h3>
                  <button @click="initiateScreening" class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700">+ New Screening</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div class="bg-white rounded-xl p-6 shadow-sm border">
                    <p class="text-sm text-gray-500">Total Screenings</p>
                    <p class="text-4xl font-bold mt-1" x-text="records.length"></p>
                  </div>
                  <div class="bg-white rounded-xl p-6 shadow-sm border">
                    <p class="text-sm text-gray-500">Verified</p>
                    <p class="text-4xl font-bold text-green-600 mt-1" x-text="records.filter(r => r.status === 'verified').length"></p>
                  </div>
                  <div class="bg-white rounded-xl p-6 shadow-sm border">
                    <p class="text-sm text-gray-500">Flagged</p>
                    <p class="text-4xl font-bold text-red-600 mt-1" x-text="records.filter(r => r.status === 'flagged').length"></p>
                  </div>
                </div>
                <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                  <table class="w-full">
                    <thead class="bg-gray-50">
                      <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Type</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Provider</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Risk Flags</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y">
                      <template x-for="r in records" :key="r.id">
                        <tr class="hover:bg-gray-50">
                          <td class="px-6 py-4 font-mono text-sm" x-text="r.id.substring(0,8)"></td>
                          <td class="px-6 py-4 text-sm" x-text="r.screening_type"></td>
                          <td class="px-6 py-4 text-sm" x-text="r.provider"></td>
                          <td class="px-6 py-4">
                            <span class="px-2 py-1 text-xs rounded-full" :class="r.status === 'verified' ? 'bg-green-100 text-green-700' : r.status === 'flagged' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700'" x-text="r.status"></span>
                          </td>
                          <td class="px-6 py-4">
                            <div class="flex gap-1">
                              <template x-for="flag in (r.risk_flags || [])" :key="flag">
                                <span class="px-2 py-0.5 text-xs bg-red-50 text-red-600 rounded" x-text="flag"></span>
                              </template>
                            </div>
                          </td>
                          <td class="px-6 py-4 text-sm">
                            <button @click="processScreening(r.id)" x-show="r.status === 'pending'" class="text-primary-600 hover:underline mr-2">Process</button>
                            <button class="text-gray-600 hover:underline">View</button>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </template>

            <!-- Credentials -->
            <template x-if="currentPage === 'credentials'">
              <div x-data="credentialsPage()" class="space-y-4">
                <div class="flex justify-between items-center">
                  <h3 class="text-lg font-semibold">Selective Disclosure Credentials</h3>
                  <button @click="issueCredential" class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700">+ Issue Credential</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div class="bg-white rounded-xl p-6 shadow-sm border">
                    <p class="text-sm text-gray-500">Total Credentials</p>
                    <p class="text-4xl font-bold mt-1" x-text="credentials.length"></p>
                  </div>
                  <div class="bg-white rounded-xl p-6 shadow-sm border">
                    <p class="text-sm text-gray-500">Active</p>
                    <p class="text-4xl font-bold text-green-600 mt-1" x-text="credentials.filter(c => c.status === 'active').length"></p>
                  </div>
                  <div class="bg-white rounded-xl p-6 shadow-sm border">
                    <p class="text-sm text-gray-500">Revoked</p>
                    <p class="text-4xl font-bold text-red-600 mt-1" x-text="credentials.filter(c => c.status === 'revoked').length"></p>
                  </div>
                </div>
                <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                  <table class="w-full">
                    <thead class="bg-gray-50">
                      <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Type</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Issuer</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Subject</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Issued</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y">
                      <template x-for="cred in credentials" :key="cred.id">
                        <tr class="hover:bg-gray-50">
                          <td class="px-6 py-4 font-mono text-sm" x-text="cred.id.substring(0,8)"></td>
                          <td class="px-6 py-4 text-sm" x-text="cred.credential_type"></td>
                          <td class="px-6 py-4 text-sm" x-text="cred.issuer"></td>
                          <td class="px-6 py-4 text-sm" x-text="cred.subject"></td>
                          <td class="px-6 py-4">
                            <span class="px-2 py-1 text-xs rounded-full" :class="cred.status === 'active' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'" x-text="cred.status"></span>
                          </td>
                          <td class="px-6 py-4 text-sm text-gray-500" x-text="cred.issued_at"></td>
                          <td class="px-6 py-4 text-sm">
                            <button @click="verifyCredential(cred.id)" class="text-primary-600 hover:underline mr-2">Verify</button>
                            <button @click="revokeCredential(cred.id)" x-show="cred.status === 'active'" class="text-red-600 hover:underline">Revoke</button>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </template>

            <!-- Payments -->
            <template x-if="currentPage === 'payments'">
              <div x-data="paymentsPage()" class="space-y-4">
                <div class="flex justify-between items-center">
                  <h3 class="text-lg font-semibold">Payments</h3>
                  <button @click="createPayment" class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700">+ New Payment</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                  <div class="bg-white rounded-xl p-6 shadow-sm border">
                    <p class="text-sm text-gray-500">Total Payments</p>
                    <p class="text-4xl font-bold mt-1" x-text="payments.length"></p>
                  </div>
                  <div class="bg-white rounded-xl p-6 shadow-sm border">
                    <p class="text-sm text-gray-500">Completed</p>
                    <p class="text-4xl font-bold text-green-600 mt-1" x-text="payments.filter(p => p.status === 'completed').length"></p>
                  </div>
                  <div class="bg-white rounded-xl p-6 shadow-sm border">
                    <p class="text-sm text-gray-500">Pending</p>
                    <p class="text-4xl font-bold text-yellow-600 mt-1" x-text="payments.filter(p => p.status === 'pending').length"></p>
                  </div>
                  <div class="bg-white rounded-xl p-6 shadow-sm border">
                    <p class="text-sm text-gray-500">Refunded</p>
                    <p class="text-4xl font-bold text-red-600 mt-1" x-text="payments.filter(p => p.status === 'refunded').length"></p>
                  </div>
                </div>
                <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                  <table class="w-full">
                    <thead class="bg-gray-50">
                      <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Booking</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Amount</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Method</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y">
                      <template x-for="p in payments" :key="p.id">
                        <tr class="hover:bg-gray-50">
                          <td class="px-6 py-4 font-mono text-sm" x-text="p.id.substring(0,8)"></td>
                          <td class="px-6 py-4 text-sm" x-text="p.booking_id ? p.booking_id.substring(0,8) : '-'"></td>
                          <td class="px-6 py-4 text-sm font-medium" x-text="'$' + p.amount.toFixed(2)"></td>
                          <td class="px-6 py-4 text-sm" x-text="p.method"></td>
                          <td class="px-6 py-4">
                            <span class="px-2 py-1 text-xs rounded-full" :class="p.status === 'completed' ? 'bg-green-100 text-green-700' : p.status === 'pending' ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700'" x-text="p.status"></span>
                          </td>
                          <td class="px-6 py-4 text-sm">
                            <button @click="processPayment(p.id)" x-show="p.status === 'pending'" class="text-green-600 hover:underline mr-2">Process</button>
                            <button @click="refundPayment(p.id)" x-show="p.status === 'completed'" class="text-red-600 hover:underline">Refund</button>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </template>

            <!-- Messages -->
            <template x-if="currentPage === 'messages'">
              <div x-data="messagesPage()" class="flex h-[calc(100vh-200px)]">
                <div class="w-1/3 bg-white rounded-l-xl shadow-sm border-r overflow-y-auto">
                  <div class="p-4 border-b">
                    <input type="search" x-model="searchQuery" placeholder="Search conversations..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-primary-500">
                  </div>
                  <div class="divide-y">
                    <template x-for="conv in filteredConversations" :key="conv.id">
                      <div @click="selectConversation(conv.id)" class="p-4 hover:bg-gray-50 cursor-pointer" :class="selectedConversation === conv.id ? 'bg-primary-50 border-l-4 border-primary-600' : ''">
                        <div class="flex justify-between items-start">
                          <span class="font-medium text-sm" x-text="conv.name"></span>
                          <span class="text-xs text-gray-500" x-text="conv.lastMessageTime"></span>
                        </div>
                        <p class="text-sm text-gray-500 mt-1 truncate" x-text="conv.lastMessage"></p>
                      </div>
                    </template>
                  </div>
                </div>
                <div class="flex-1 bg-white rounded-r-xl shadow-sm flex flex-col">
                  <template x-if="selectedConversation">
                    <div class="flex flex-col h-full">
                      <div class="p-4 border-b flex items-center gap-3">
                        <div class="w-8 h-8 bg-primary-100 text-primary-700 rounded-full flex items-center justify-center text-sm font-bold" x-text="getCurrentConversation()?.name?.charAt(0)"></div>
                        <span class="font-medium" x-text="getCurrentConversation()?.name"></span>
                        <span class="ml-auto text-xs text-green-600 flex items-center gap-1">
                          <span class="w-2 h-2 bg-green-500 rounded-full"></span> Online
                        </span>
                      </div>
                      <div class="flex-1 overflow-y-auto p-4 space-y-3">
                        <template x-for="msg in currentMessages" :key="msg.id">
                          <div class="flex" :class="msg.sender_id === 'me' ? 'justify-end' : 'justify-start'">
                            <div class="max-w-xs px-4 py-2 rounded-2xl text-sm" :class="msg.sender_id === 'me' ? 'bg-primary-600 text-white rounded-br-none' : 'bg-gray-100 text-gray-900 rounded-bl-none'">
                              <p x-text="msg.content"></p>
                              <p class="text-xs mt-1 opacity-70" x-text="msg.time"></p>
                            </div>
                          </div>
                        </template>
                      </div>
                      <div class="p-4 border-t">
                        <form @submit.prevent="sendMessage" class="flex gap-2">
                          <input x-model="newMessage" type="text" placeholder="Type a message..." class="flex-1 px-4 py-2 border rounded-full text-sm focus:ring-2 focus:ring-primary-500">
                          <button type="submit" class="px-4 py-2 bg-primary-600 text-white rounded-full hover:bg-primary-700 text-sm">Send</button>
                        </form>
                      </div>
                    </div>
                  </template>
                  <template x-if="!selectedConversation">
                    <div class="flex items-center justify-center h-full text-gray-400">
                      <div class="text-center">
                        <svg class="w-16 h-16 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                        <p>Select a conversation to start messaging</p>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <!-- Settings -->
            <template x-if="currentPage === 'settings'">
              <div x-data="settingsPage()" class="space-y-4">
                <h3 class="text-lg font-semibold">Settings</h3>
                <div class="bg-white rounded-xl shadow-sm border p-6 space-y-4">
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Display Name</label>
                    <input type="text" class="w-full px-4 py-2 border rounded-lg" :value="$store.auth.user?.name">
                  </div>
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" class="w-full px-4 py-2 border rounded-lg" :value="$store.auth.user?.email" disabled>
                  </div>
                  <button class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700">Save Changes</button>
                </div>
              </div>
            </template>
          </div>
        </main>
      </div>
    </template>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/src/stores/auth.js"></script>
  <script src="/src/api.js"></script>
  <script src="/src/app.js"></script>
</body>
</html>
